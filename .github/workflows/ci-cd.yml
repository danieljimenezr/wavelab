# Continuous integration and deployment.
#
# PILOT for DR Solutions: the decisions here are made on the assumption that this file gets copied
# into other repositories, not merely that it works once.
#
#   · Deployment DEPENDS on the tests. Red code is never shipped.
#   · `concurrency` with cancel-in-progress FALSE: cancelling a deployment halfway leaves the server
#     in an indeterminate state, which is worse than making the next one wait.
#   · It deploys a SPECIFIC SHA, not "the latest on main", which changes between the pipeline
#     starting and finishing.
#   · Least privilege: the token can only read the repository.
#   · Automatic rollback lives on the SERVER, not here: if the runner dies halfway, the rollback
#     has to happen anyway.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.10"

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python 3.13 and dependencies
        run: uv sync --frozen --group dev

      - name: Lint
        # Blocking, and `.` on purpose: it is the exact command that gets run locally, so the gate
        # cannot pass on a narrower path set than the one that was verified. ruff is version-ranged
        # in pyproject for the same reason — a minor bump ships new rules, and a lint step that can
        # turn the pipeline red for something nobody pushed is a lint step people learn to ignore.
        run: uv run ruff check .

      - name: Tests
        # The ones marked `net` are excluded: they depend on Binance answering, and a pipeline that
        # fails because of someone else's API teaches the team to ignore failures, which is the
        # worst thing that can happen to a pipeline.
        run: uv run pytest -m "not net" --tb=short -q

      - name: Check that the hypotheses load
        run: |
          uv run python -c "
          from wavelab.hypotheses import load_all
          n = len(load_all())
          assert n >= 90, f'only {n} hypotheses load'
          print(f'{n} hypotheses registered')"

  deploy:
    name: Deploy to production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
      url: https://assay.dr-techsolutions.com
    steps:
      - name: Prepare the deploy key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy ${{ github.sha }}
        # The key is restricted with command= on the server: even if it leaked, all it can do is
        # run the deploy script. It opens no shell, forwards no ports, reads no files.
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
              root@${{ secrets.VPS_HOST }} "${{ github.sha }}"

      - name: Check that it answers from outside
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
                   https://assay.dr-techsolutions.com/api/status || echo 000)
            [ "$code" = "200" ] && { echo "answers 200"; exit 0; }
            echo "attempt $i: HTTP $code"; sleep 6
          done
          echo "WARNING: not answering publicly yet (DNS not configured?)."
          echo "The internal service is deployed and verified by the deploy script itself."
