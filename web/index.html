<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wavelab — BTCUSDT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>📈</text></svg>">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#21262d; --txt:#e6edf3; --dim:#8b949e;
    --up:#26a69a; --down:#ef5350; --accent:#58a6ff; --warn:#d29922; --bad:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:13px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:18px;padding:10px 16px;
         background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-weight:650;letter-spacing:.3px}
  .brand small{color:var(--dim);font-weight:400;margin-left:6px}
  .price{font-variant-numeric:tabular-nums;font-size:19px;font-weight:600}
  .chg{font-variant-numeric:tabular-nums;font-size:12px;padding:2px 6px;border-radius:4px}
.pages{display:flex;gap:2px}
  .pages a{color:var(--dim);text-decoration:none;padding:5px 12px;border-radius:6px;font-size:12.5px}
  .pages a:hover{color:var(--txt);background:rgba(255,255,255,.05)}
  .pages a.on{color:var(--txt);background:rgba(88,166,255,.14)}
  .tfs{display:flex;gap:4px;margin-left:auto}
  .tf{background:transparent;border:1px solid var(--line);color:var(--dim);
      padding:4px 11px;border-radius:6px;cursor:pointer;font:inherit;font-size:12px}
  .tf:hover{border-color:var(--accent);color:var(--txt)}
  .tf.on{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:600}
  .tf .role{display:block;font-size:9px;opacity:.75;text-transform:uppercase;letter-spacing:.5px}
  .wrap{display:flex;height:calc(100vh - 108px)}
  #chart{flex:1;min-width:0}
  #panel{width:330px;flex:none;overflow-y:auto;background:var(--panel);
         border-left:1px solid var(--line);padding:12px 14px}
  .verdict{display:inline-block;padding:3px 10px;border-radius:5px;font-weight:650;
           font-size:11px;letter-spacing:.4px;text-transform:uppercase}
  .v-no{background:rgba(139,148,158,.18);color:var(--dim)}
  .v-watch{background:rgba(210,153,34,.18);color:var(--warn)}
  .v-act{background:rgba(38,166,154,.2);color:var(--up)}
  .badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;
         background:rgba(248,81,73,.14);color:var(--bad);margin-left:6px}
  .hyp{border:1px solid var(--line);border-radius:8px;padding:10px;margin:10px 0;
       background:rgba(255,255,255,.015)}
  .hyp.top{border-color:#3d4a5c}
  .hyp h4{margin:0 0 6px;font-size:12px;font-weight:600}
  .row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:2px 0;
       font-variant-numeric:tabular-nums}
  .row b{font-weight:600}
  .lbl{color:var(--dim)}
  .inval{color:var(--bad);font-weight:600}
  .zone{color:var(--accent)}
  .why{font-size:11px;color:var(--dim);line-height:1.45;margin-top:7px;
       border-top:1px solid var(--line);padding-top:7px}
  .why li{margin:3px 0}
  .why ul{margin:0;padding-left:15px}
  h3.sec{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);
         margin:14px 0 4px;font-weight:600}
  .arith{font-size:11px;color:var(--dim);background:rgba(0,0,0,.25);border-radius:6px;
         padding:7px 9px;margin-top:7px;line-height:1.6;font-variant-numeric:tabular-nums}
  footer{display:flex;gap:20px;align-items:center;padding:6px 16px;background:var(--panel);
         border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;flex-wrap:wrap}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
  .ok{background:var(--up)} .warn{background:var(--warn)} .bad{background:var(--bad)}
  kbd{background:var(--line);border-radius:3px;padding:1px 5px;font-size:10.5px}
  .banner{display:none;padding:7px 16px;background:#3d2e00;color:#f0d68a;
          border-bottom:1px solid #5c4600;font-size:12px}
  .banner.show{display:block}
</style>
</head>
<body>
<header>
  <div class="brand">wavelab <small id="sym">BTCUSDT</small></div>
  <nav class="pages">
    <a href="./index.html" class="on">Gráfico</a>
    <a href="./validador.html">¿Tu estrategia es real?</a>
  </nav>
  <div class="price" id="px">—</div>
  <div class="chg" id="chg"></div>
  <nav class="tfs" id="tfs"></nav>
</header>

<div class="banner" id="banner"></div>
<div class="wrap">
  <div id="chart"></div>
  <aside id="panel"><div class="lbl" style="font-size:11.5px">analizando…</div></aside>
</div>

<footer>
  <span><span class="dot" id="d-feed"></span><span id="s-feed">conectando…</span></span>
  <span id="s-mode">—</span>
  <span id="s-gaps">—</span>
  <span id="s-lag">—</span>
  <span id="s-recon">—</span>
  <span id="s-piv" style="color:#c9a227">—</span>
  <span style="margin-left:auto">
    solo visual · sin órdenes · <kbd>1m</kbd> es la única serie almacenada, el resto se resamplea
  </span>
</footer>

<script type="module" src="./app.js"></script>
</body>
</html>
