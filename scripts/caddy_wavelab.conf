# Bloque de Caddy para el validador. Se AÑADE al Caddyfile existente sin tocar nada de lo demás.
#
# Requisito previo: un registro A de validador.dr-techsolutions.com apuntando a 187.33.152.210.
# Caddy pedirá el certificado TLS solo, en cuanto el DNS resuelva.
#
# DECISIÓN DE SEGURIDAD: lista blanca de rutas, no lista negra. Solo se expone lo que el producto
# necesita. El gráfico con las señales de Elliott, el WebSocket y el histórico se quedan fuera:
# son la herramienta privada del dueño, y menos superficie expuesta es menos que auditar. El
# servicio además arranca con WAVELAB_PUBLIC=1, que los bloquea también en la aplicación —
# defensa en profundidad, porque una lista blanca mal escrita es un fallo de una sola línea.

validador.dr-techsolutions.com {
	encode zstd gzip

	# Cabeceras de seguridad. La CSP es estricta a propósito: la página no carga nada de fuera,
	# así que puede permitírselo, y eso cierra de golpe toda la familia de XSS.
	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Content-Type-Options "nosniff"
		X-Frame-Options "DENY"
		Referrer-Policy "no-referrer"
		Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
		-Server
	}

	@permitido {
		path / /validador.html /validador.js /vendor/* /favicon.ico
		path /api/hipotesis /api/validar /api/validar_csv /api/validar_regla /api/ayuda_regla /api/estado
	}

	handle @permitido {
		# Las validaciones tardan entre 5 y 10 s: los 250 controles aleatorios no son gratis.
		# Un tiempo de espera corto aquí cortaría respuestas legítimas a mitad.
		reverse_proxy 127.0.0.1:8000 {
			transport http {
				response_header_timeout 90s
				read_timeout 90s
			}
		}
	}

	# Todo lo demás no existe. Devolver 404 y no 403 evita confirmar qué rutas hay detrás.
	handle {
		respond "no encontrado" 404
	}

	# Tope de cuerpo: un CSV de un usuario real no pasa de unos pocos MB. 500 MB no es un
	# usuario, es un ataque, y conviene cortarlo en el proxy antes de que llegue a Python.
	request_body {
		max_size 12MB
	}

	log {
		output file /var/log/caddy/validador.log {
			roll_size 20MB
			roll_keep 5
		}
	}
}
