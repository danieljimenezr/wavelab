# Caddy block for Assay. It is APPENDED to the existing Caddyfile without touching anything else.
#
# Prerequisite: an A record for assay.dr-techsolutions.com pointing at 187.33.152.210.
# Caddy will request the TLS certificate on its own as soon as DNS resolves.
#
# SECURITY DECISION: an allowlist of routes, not a blocklist. Only what the product needs is
# exposed. The chart with the Elliott signals, the WebSocket and the history stay out: they are the
# owner's private tool, and less exposed surface is less to audit. The service also starts with
# WAVELAB_PUBLIC=1, which blocks them in the application as well — defence in depth, because a
# badly written allowlist is a one-line failure.

assay.dr-techsolutions.com {
	encode zstd gzip

	# Security headers. The CSP is deliberately strict: the page loads nothing from outside, so it
	# can afford to be, and that shuts down the whole XSS family in one go.
	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Content-Type-Options "nosniff"
		X-Frame-Options "DENY"
		Referrer-Policy "no-referrer"
		Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
		-Server
	}

	@allowed {
		# /i18n.js is NOT optional: assay.html and assay.js both import it as an ES module, and a
		# 404 here leaves the page blank with no error a user could act on.
		# Same trap, quieter: /hyp.es.json and /hyp.ca.json carry the rationale and the prior of
		# the 100 hypotheses in Spanish and Catalan, fetched on demand when the reader is not
		# reading in English. A 404 here does not break the page —it falls back to the English
		# text— which is exactly why it would go unnoticed. They are listed one by one, not as
		# /hyp.*.json: the allowlist stays an enumeration of what exists.
		path / /assay.html /assay.js /i18n.js /hyp.es.json /hyp.ca.json /vendor/* /favicon.ico
		path /api/hypotheses /api/validate /api/validate_csv /api/validate_rule /api/rule_help /api/status
	}

	handle @allowed {
		# Validations take between 5 and 10 s: the 250 random controls are not free.
		# A short timeout here would cut legitimate responses off halfway.
		reverse_proxy 127.0.0.1:8000 {
			transport http {
				response_header_timeout 90s
				read_timeout 90s
			}
		}
	}

	# Everything else does not exist. Returning 404 rather than 403 avoids confirming which routes
	# are behind it.
	handle {
		respond "not found" 404
	}

	# Body cap: a real user's CSV does not go beyond a few MB. 500 MB is not a user, it is an
	# attack, and it is better cut off at the proxy before it reaches Python.
	request_body {
		max_size 12MB
	}

	log {
		output file /var/log/caddy/assay.log {
			roll_size 20MB
			roll_keep 5
		}
	}
}
