# Global configuration. The ENGINE parameters live in [engine] and are not tuned:
# any change here writes a row into trials.sqlite and counts toward the effective N.

data_dir = "data"

# Role separation as a hard invariant: 1d/4h veto, 1h classifies the regime,
# 15m is the ONLY one that draws entries.
trigger_tf = "15m"
regime_tf  = "1h"
gate_tfs   = ["4h", "1d"]

# The interface only shows longs, but the engine also evaluates and records shorts in shadow.
directions = ["long"]
shadow_opposite_direction = true

plugin_modules = []

[engine]
zigzag_k_atr  = 1.5
zigzag_min_pct = 0.005
atr_period    = 14
er_period     = 20
er_trend_enter = 0.35
er_trend_exit  = 0.28
er_chop_enter  = 0.20
er_chop_exit   = 0.26
stop_buffer_atr = 0.25
max_stop_atr  = 3.0
min_stop_atr  = 0.75
ev_min_r      = 0.15
window_bars   = 5000
