[project]
name = "wavelab"
version = "0.1.0"
description = "Real-time BTC analyser: causal Elliott waves, market regime, and entry/exit points with explicit invalidation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13,<3.14"

dependencies = [
    # --- numeric core ----------------------------------------------------
    # numpy: the real upper bound comes from scipy (numpy<2.8). If numba ever
    # lands on the hot path, this has to drop to <2.6 (numba 0.67 pins it).
    "numpy>=2.5,<2.8",
    # pandas: ONLY at the I/O boundary and for resampling, never inside a loop.
    # The <3 pin is the only real reason this project runs on 3.13 and not 3.14.
    "pandas>=2.3.3,<3",
    "scipy>=1.18,<2",
    # TA-Lib >=0.6.5 SHIPS the C library inside the wheel: `brew install ta-lib` is NOT needed.
    "ta-lib>=0.7.1,<0.8",
    "scikit-learn>=1.9,<2",

    # --- storage ---------------------------------------------------------
    "duckdb>=1.5.5,<2",     # offline analysis only, one connection per job
    "pyarrow>=21",          # Parquet boundary

    # --- network ---------------------------------------------------------
    "httpx[http2]>=0.28",
    "websockets>=17.1",
    # ccxt is MIT and INCLUDES the Pro WebSocket layer for free.
    # The `ccxtpro` package and the "CCXT Pro" subscription are legacy: do NOT pay.
    "ccxt>=4.5.78",
    # ccxt pins orjson==3.11.9 EXACTLY: declaring >=3.12 makes the lockfile unresolvable.
    "orjson>=3.11.9",

    # --- server ----------------------------------------------------------
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
]

[project.optional-dependencies]
# Installed at M6b-M7b. Kept out of the core so the VPS live process does not
# have to carry lightgbm or statsmodels.
validation = [
    "arch>=7.2",          # bootstrap.MCS, bootstrap.SPA, Politis-White block length
    "statsmodels>=0.14",  # ADF for the d search in fractional differentiation
    "lightgbm>=4.5",      # meta-labeller (requires `brew install libomp` on macOS)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "hypothesis>=6.100",
    "pytest-benchmark>=5.1",
    "syrupy>=4.8",
    "ruff>=0.16.6,<0.17",   # ranged since lint became a deploy gate: see ci-cd.yml
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wavelab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `not net` belongs HERE and not only in the CI command. It used to live only in ci-cd.yml,
# so `make test`, a bare `pytest`, and anything else a person or an agent ran went to
# Binance — a different suite from the one that gates the deploy, and the difference was a
# network call. Opt in explicitly with `-m net` (or `make test-net`) when that is what you
# mean. The reasoning is the same one ci-cd.yml gives: a run that fails because of someone
# else's API teaches people that red means "try again".
addopts = "-q --strict-markers -m 'not net'"
markers = [
    "slow: slow tests (long replays, hydration)",
    "net: tests that hit the internet (excluded by default everywhere; `-m net` opts in)",
]
# A RuntimeWarning out of NumPy is this codebase's most likely silent-corruption signal: "invalid
# value encountered in cast" is how a NaN becomes an arbitrary int8 position, and "divide by zero"
# is how a risk of zero becomes an infinite R. Neither raises and both produce a plausible number,
# so warnings from that family are failures here. Not ALL warnings: an unclosed-file
# ResourceWarning in the liquidation log currently trips `-W error`, and turning that into a deploy
# gate would be noise standing in front of the guard that matters.
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
